name: Build Note 9 Kernel - SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Tên file defconfig trong arch/arm64/configs'
        required: true
        default: 'exynos9810_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Dọn dung lượng ổ đĩa runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Cài gói phụ thuộc build kernel
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

      - name: Clone nhánh duhan-(4.9.337)
        uses: actions/checkout@v4
        with:
          ref: duhan-(4.9.337)
          depth: 1

      - name: Gỡ KernelSU-Next và kiểm tra manual hooks
        run: |
          git submodule deinit -f KernelSU-Next || true
          git rm -f KernelSU-Next || true
          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu
          echo "=== KIEM TRA MANUAL HOOKS TRONG SOURCE ==="
          grep -rnE "ksu_handle_|is_ksu_allowed|ksu_input_hook" fs/ drivers/input/ || echo "Chua thay manual hooks chuan"

      - name: Cài đặt SukiSU-Ultra và bật cấu hình KSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          DEFCONFIG_PATH="arch/arm64/configs/${{ github.event.inputs.defconfig }}"
          scripts/config --file "$DEFCONFIG_PATH" -e KSU
          scripts/config --file "$DEFCONFIG_PATH" -d KSU_KPROBES_HOOK
          scripts/config --file "$DEFCONFIG_PATH" -e KSU_MANUAL_HOOK || true
          echo "CONFIG_KSU=y" >> "$DEFCONFIG_PATH"
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG_PATH"

      - name: Tải Neutron Clang toolchain
        run: |
          mkdir -p toolchain && cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=latest
          cd ..

      - name: Biên dịch kernel Exynos 9810
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$PWD/toolchain/bin:$PATH"
          make O=out ARCH=arm64 "${{ github.event.inputs.defconfig }}"
          grep -E "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK" out/.config || true
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 \
            LLVM_IAS=1

      - name: Đóng gói file ZIP flash TWRP bằng AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          sed -i 's|BLOCK=auto;|BLOCK=/dev/block/platform/11120000.ufs/by-name/BOOT;|g' AnyKernel3/anykernel.sh
          sed -i 's|IS_SLOT_DEVICE=auto;|IS_SLOT_DEVICE=0;|g' AnyKernel3/anykernel.sh
          sed -i 's|device.name1=maguro|device.name1=crownlte|g' AnyKernel3/anykernel.sh
          sed -i 's|device.name2=toro|device.name2=crownlteks|g' AnyKernel3/anykernel.sh
          cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../Note9-N960N-SukiSU-Ultra-AnyKernel3.zip * -x .git README.md *placeholder

      - name: Tải lên Artifacts file ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Note9-N960N-SukiSU-Ultra-Zip
          path: Note9-N960N-SukiSU-Ultra-AnyKernel3.zip
